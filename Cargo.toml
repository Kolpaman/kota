[workspace]
resolver = "3"
members = ["crates/kota-core", "crates/kota", "crates/kota-win"]
# Linux'ta `cargo build` Windows uygulamasını (Tauri/WebView2) derlemez.
default-members = ["crates/kota-core", "crates/kota"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ensignalp/kota"
