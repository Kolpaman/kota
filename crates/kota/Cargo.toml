[package]
name = "kota"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AI kullanım limitleri: CLI, D-Bus servisi ve GNOME paneli için çekirdek"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
kota-core = { path = "../kota-core" }
libc = "0.2.191"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
base64 = "0.23.1"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process"] }
zbus = { version = "6.2.1", default-features = false, features = ["tokio", "service", "proxy"] }

[dev-dependencies]
tempfile = "3.27.0"
